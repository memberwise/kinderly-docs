  - main [ref=f53e45]:
    - generic [ref=f53e47]:
      - paragraph [ref=f53e48]: Honest comparison
      - heading "Kinderly vs. Procare" [level=1] [ref=f53e49]
      - paragraph [ref=f53e50]: Procare has run childcare centers for thirty years and does a great deal well. Kinderly covers the same ground for small and mid-size centers without the modules, the implementation, or the annual contract.
      - generic [ref=f53e51]:
        - link "Get started free" [ref=f53e52] [cursor=pointer]:
          - /url: https://go.mykinderly.com/signup
        - link "Book a walkthrough" [ref=f53e53] [cursor=pointer]:
          - /url: /request-demo
      - paragraph [ref=f53e54]: Free up to 10 children · No credit card · Everyone on your team included
    - generic [ref=f53e56]:
      - generic [ref=f53e57]:
        - heading "The short answer" [level=2] [ref=f53e58]
        - paragraph [ref=f53e59]: We'd rather you pick the right software than pick ours. Here's the honest split.
      - generic [ref=f53e60]:
        - article [ref=f53e61]:
          - paragraph [ref=f53e62]: Choose Procare if
          - paragraph [ref=f53e63]: You run 15+ locations, have complex multi-state subsidy billing, or depend on Procare's hardware ecosystem. Their enterprise depth is real and switching away from it has genuine cost.
        - article [ref=f53e64]:
          - paragraph [ref=f53e65]: Choose Kinderly if
          - paragraph [ref=f53e66]: You run one to a handful of centers, want to be live this week rather than next quarter, and would rather pay one flat published price than assemble a quote out of modules.
    - generic [ref=f53e68]:
      - paragraph [ref=f53e69]: Procare is the incumbent for a reason. It has been in this market since the 1990s, it is deeply featured, and for large multi-site operators with complex subsidy billing it remains genuinely hard to beat.
      - paragraph [ref=f53e70]: The complaint we hear most from directors is not about capability — it is about weight. Modules priced separately, implementation measured in weeks, an interface that needs training, and a bill that's difficult to predict from one year to the next.
    - generic [ref=f53e72]:
