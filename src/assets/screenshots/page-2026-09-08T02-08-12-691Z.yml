      - paragraph [ref=f53e194]:
        - text: Kinderly figures reflect our published pricing as of August 2026. Procare does not publish standard pricing, so entries in italics are based on what centers tell us rather than published material — always confirm against your own quote. Spotted something out of date?
        - link "Tell us" [ref=f53e195] [cursor=pointer]:
          - /url: /contact
        - text: and we'll correct it.
    - generic [ref=f53e197]:
      - heading "Where Kinderly pulls ahead" [level=2] [ref=f53e199]
      - generic [ref=f53e200]:
        - article [ref=f53e201]:
          - generic [ref=f53e202]: "1"
          - heading "One price, not a stack of modules" [level=3] [ref=f53e203]
          - paragraph [ref=f53e204]: The most common Procare frustration we hear is discovering that parent engagement, online payments, and digital enrollment are each their own line item. Kinderly has one price per center that includes Enroll, Grow, and Manage in full. The number on our pricing page is the number.
        - article [ref=f53e205]:
          - generic [ref=f53e206]: "2"
          - heading "Live today, not next quarter" [level=3] [ref=f53e207]
          - paragraph [ref=f53e208]: There is no implementation phase. Sign up, import your children and families, and send your first enrollment packet the same afternoon. Onboarding help is included on every paid plan — but most directors don't need to book time with us to get started.
        - article [ref=f53e209]:
          - generic [ref=f53e210]: "3"
          - heading "Software that doesn't need a training manual" [level=3] [ref=f53e211]
          - paragraph [ref=f53e212]: Procare's depth comes with a learning curve, and every new hire pays it again. Kinderly was designed for directors and office managers, not for people who've been trained on it. If your assistant director can use it on day one without calling you, that's the whole design goal.
        - article [ref=f53e213]:
          - generic [ref=f53e214]: "4"
          - heading "Month to month, with your data on the way out" [level=3] [ref=f53e215]
          - paragraph [ref=f53e216]: No annual commitment and no early-termination clause. If it isn't working, export cleanly and leave. We would rather earn next month than lock in next year.
    - generic [ref=f53e220]:
      - heading "Switching from Procare" [level=2] [ref=f53e221]
      - paragraph [ref=f53e222]: Export your child, family, and staff records and our team handles the import as part of onboarding — included at no cost on every paid plan. Most centers are running within a few days, and you can keep both systems side by side while you get comfortable.
      - list [ref=f53e223]:
        - listitem [ref=f53e224]: We import your records for you — no spreadsheet surgery
        - listitem [ref=f53e228]: Month-to-month, so there's no contract to escape later
        - listitem [ref=f53e232]: Your data exports cleanly if you ever leave us too
      - link "Talk to us about switching" [ref=f53e236] [cursor=pointer]:
        - /url: /request-demo
    - generic [ref=f53e240]:
      - generic [ref=f53e241]:
        - paragraph [ref=f53e242]: Questions
        - heading "Kinderly vs. Procare — common questions" [level=2] [ref=f53e243]
      - generic [ref=f53e244]:
        - group [ref=f53e245]:
          - heading "How much does Procare cost compared to Kinderly?" [level=3] [ref=f53e247] [cursor=pointer]
          - paragraph [ref=f53e251]: Procare quotes each center individually rather than publishing standard pricing, and the total depends on which modules you include — so we won't invent a number. Kinderly is free up to 10 active children, $49.99/month up to 50, and $99.99/month up to 100, with everything included and unlimited staff seats. Ask Procare for a full quote including every module you'd need, then compare.
        - group [ref=f53e252]:
          - heading "Can I import my data from Procare?" [level=3] [ref=f53e254] [cursor=pointer]
        - group [ref=f53e258]:
          - heading "Does Kinderly handle state subsidy reporting?" [level=3] [ref=f53e260] [cursor=pointer]
        - group [ref=f53e264]:
          - heading "Is Kinderly a real replacement for a full CCMS?" [level=3] [ref=f53e266] [cursor=pointer]
