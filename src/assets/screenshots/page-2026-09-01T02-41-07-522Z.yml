      - link "Post video to the feed Aug 27 Posts now take video as well as photos — up to 20 attachments per post, 200 MB per clip. Drop a clip into the composer in Manage or record one straight from the Teachers app, and families see it play right in their feed, with a still frame standing in while it loads. Learn more" [ref=f4e24] [cursor=pointer]:
