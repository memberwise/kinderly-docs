          - generic [ref=f4e52]: Learn more
      - link "Document expiration dates & reporting Aug 21 Documents can now carry an expiration date — center documents, child, guardian and staff files, and share links. Rows show how long they have left, and a reminder goes out a week before one lapses. The new Expiring Documents & Shares report lists everything that has expired or is about to, so you can chase renewals before a licensing visit. Nothing is deleted or hidden when it expires; it's only labelled. Learn more" [ref=f4e57] [cursor=pointer]:
