          - generic [ref=f4e41]: Learn more
      - link "Out-of-ratio alerts Aug 27 Kinderly now watches your classrooms during operating hours and alerts staff in the Teachers app when a room drops below its required staff-to-child ratio. It counts who is actually signed in — not who is enrolled — so an empty room at 6 am never triggers it. Switch it on, choose how often to repeat the reminder, and decide whether the room’s own teachers are alerted or administrators only, under Center Settings → App Settings. Learn more" [ref=f4e46] [cursor=pointer]:
