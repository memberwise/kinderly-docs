          - generic [ref=f4e30]: Learn more
      - link "Recurring and all-day events Aug 27 Set an event or closure to repeat — pick the weekdays and a date range and every occurrence is created for you, up to a year out. The feed collapses a series into one row with its cadence (“Occurs every Mon, Wed & Fri”), and you can drop individual dates or delete the whole series in a click. Events and closures can also be marked all-day, so a week-long closure reads as dates rather than times. Learn more" [ref=f4e35] [cursor=pointer]:
        - /url: /manage/feed
